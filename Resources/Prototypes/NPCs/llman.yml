- type: htnCompound
  id: LLManCompound
  branches:
    # PRIORITY 1: INTERACT — move to target and interact with it
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: InteractTarget
          operator: !type:MoveToOperator
            pathfindKey: MovementPathfind
            targetKey: MovementTarget
        - !type:HTNPrimitiveTask
          operator: !type:InteractWithOperator
            targetKey: InteractTarget
        - !type:HTNPrimitiveTask
          operator: !type:DeleteKeyOperator
            key: InteractTarget
    # PRIORITY 2: MOVE — just walk to a location
    - tasks:
        - !type:HTNCompoundTask
          task: MoveToTargetCompound
    # PRIORITY 3: DROP
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: ShouldDrop
          operator: !type:DropOperator
        - !type:HTNPrimitiveTask
          operator: !type:DeleteKeyOperator
            key: ShouldDrop

  # NO IDLE FALLBACK — NPC stands still when no commands
  # - tasks:
  #   - !type:HTNCompoundTask
  #     task: IdleCompound

- type: htnCompound
  id: MoveToTargetCompound
  branches:
      - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: MovementTarget
          operator: !type:MoveToOperator
            pathfindKey: MovementPathfind
            targetKey: MovementTarget
